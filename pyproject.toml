[project]
name = "local-rag-learning"
version = "0.1.0"
description = "A local learning project for a future RAG application."
requires-python = "==3.12.12"
dependencies = [
    "streamlit==1.63.0",
    "boto3==1.43.87",
    "supabase==2.31.0",
    "pypdf==6.16.2",
    "python-magic==0.4.27",
    "clamd==1.0.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "moto[s3]==5.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]