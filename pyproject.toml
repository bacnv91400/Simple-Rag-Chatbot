[project]
name = "local-rag-learning"
version = "0.1.0"
description = "A local learning project for a future RAG application."
requires-python = "==3.12.12"
dependencies = [
    "streamlit==1.63.0",
    "boto3==1.43.87",
    "supabase==2.31.0",
    "pypdf==6.16.2",
    "python-magic==0.4.27",
    "clamd==1.0.2",
]

[dependency-groups]
dev = [
    { include-group = "worker" },
    "pytest==9.1.1",
    "moto[s3]==5.2.3",
]
worker = [
    "docling-core==2.94.0",
    "tree-sitter==0.26.0",
    "pymupdf==1.28.0",
    "google-genai==2.22.0",
    "numpy==2.5.0",
    "transformers==5.3.0",
    "httpx==0.28.1",
    "tenacity==9.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
